[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relieflens"
version = "0.1.0"
description = "Calibrated disaster-damage triage from paired satellite imagery"
requires-python = ">=3.10,<3.14"
readme = "README.md"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "shapely>=2.0",
  "tqdm>=4.66",
  "streamlit>=1.38",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
relieflens-prepare = "src.data.prepare:main"
relieflens-train = "src.training.train:main"
relieflens-evaluate = "src.evaluation.evaluate:main"
relieflens-demo = "src.dashboard.demo:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
ignore = ["E501"]
